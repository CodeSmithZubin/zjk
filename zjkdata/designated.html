<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 声明网页的内容类型为text/html（HTML 文档），字符编码为utf-8（支持多语言，包括中文）。 -->
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<!-- 声明网页的主要语言为简体中文。-->
	<meta http-equiv="Content-Language" content="zh-CN" />
	<!-- 标注网页的作者为尹燕杰_yinaje，并提供联系邮箱yinaje@163.com。-->
	<meta name="author" content="尹燕杰_yinaje,yinaje@163.com" />
	<!-- 声明网页版权归属，标注了版权标识和具体归属者尹燕杰_yinaje，强调 “保留所有权利”。 -->
	<Meta name="Copyright" Content="尹燕杰_yinaje"/>
	<Meta name="Copyright" Content="本页版权归尹燕杰_yinaje所有。All Rights Reserved"/>
    
    <title>专家库系统V3 - 指定专家设置</title>
    <link rel="stylesheet" href="zjk.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">专家库系统V3</div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <!-- 菜单将通过JavaScript动态生成 -->
            </ul>
        </div>
    </header>

    <main class="container">
        <h2 style="margin: 20px 0;">指定专家设置</h2>

        <div class="toolbar">
            <div class="button-group">
                <button class="btn btn-primary" id="designateBtn">关联指定专家</button>
                <button class="btn btn-danger" id="cancelDesignateBtn">取消指定专家</button>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table" id="designatedTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectSingle"></th>
                        <th>编号</th>
                        <th>姓名</th>
                        <th>身份证</th>
                        <th>电话</th>
                        <th>邮箱</th>
                        <th>单位</th>
                        <th>归属</th>
                        <th>是否指定</th>
                    </tr>
                </thead>
                <tbody id="designatedTableBody">
                    <!-- 表格内容将通过JavaScript动态生成 -->
                </tbody>
            </table>
        </div>

        <!-- 分页容器：展示总条数与分页控件 -->
        <div id="pagination" class="pagination"></div>
    </main>

    <script src="zjk.js"></script>
    <script src="db.js"></script>
    <script src="designated-page.js"></script>
</body>
</html>
