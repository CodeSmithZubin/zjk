<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 声明网页的内容类型为text/html（HTML 文档），字符编码为utf-8（支持多语言，包括中文）。 -->
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<!-- 声明网页的主要语言为简体中文。-->
	<meta http-equiv="Content-Language" content="zh-CN" />
	<!-- 标注网页的作者为尹燕杰_yinaje，并提供联系邮箱yinaje@163.com。-->
	<meta name="author" content="尹燕杰_yinaje,yinaje@163.com" />
	<!-- 声明网页版权归属，标注了版权标识和具体归属者尹燕杰_yinaje，强调 “保留所有权利”。 -->
	<Meta name="Copyright" Content="尹燕杰_yinaje"/>
	<Meta name="Copyright" Content="本页版权归尹燕杰_yinaje所有。All Rights Reserved"/>

    <title>专家库系统V3 - 专家库维护</title>
    <link rel="stylesheet" href="zjk.css">
    <script src="xlsx.full.min.js"></script>
    <style>
        .form-modal .form-content {
            background-color: #fff;
            margin: 100px auto;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 800px;
            position: relative;
        }

        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #f1f1f1;
            border-radius: 10px;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            background-color: #4CAF50;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">专家库系统V3</div>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <!-- 菜单将通过JavaScript动态生成 -->
            </ul>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div class="search-group">
                <select id="归属Select">
                    <option value="全部专家">全部专家</option>
                    <option value="内部专家">内部专家</option>
                    <option value="外部专家">外部专家</option>
                </select>
                <input type="text" id="searchInput" placeholder="输入搜索关键词...">
                <button class="btn btn-primary" id="searchBtn">搜索</button>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" id="addBtn">新增</button>
                <button class="btn btn-danger" id="deleteBtn">删除</button>
                <button class="btn btn-primary" id="editBtn">编辑</button>
                <button class="btn btn-primary" id="exportBtn">导出</button>
                <input type="file" id="importFile" style="display: none" accept=".csv,.xlsx,.xls">
                <button class="btn btn-primary" id="importBtn">导入</button>
                <button class="btn btn-primary" id="templateBtn">下载模板</button>
                <button class="btn btn-primary" id="initBtn">初始化</button>
                <button class="btn btn-primary" id="backupBtn">备份</button>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table" id="expertTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>编号</th>
                        <th>姓名</th>
                        <th>身份证</th>
                        <th>电话</th>
                        <th>邮箱</th>
                        <th>单位</th>
                        <th>备注</th>
                        <th>归属</th>
                    </tr>
                </thead>
                <tbody id="expertTableBody">
                    <!-- 表格内容将通过JavaScript动态生成 -->
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination">
            <!-- 分页控件将通过JavaScript动态生成 -->
        </div>
    </main>

    <!-- 新增/编辑专家模态框 -->
    <div class="form-modal" id="expertModal" style="display: none;">
        <div class="form-content">
            <h2 id="modalTitle">新增专家</h2>
            <form id="expertForm">
                <input type="hidden" id="formMode" value="add">
                <input type="hidden" id="formZjno">
                
                <div class="form-group">
                    <label for="formZjname">姓名 *</label>
                    <input type="text" id="formZjname" required>
                </div>
                
                <div class="form-group">
                    <label for="formZjsfno">身份证 *</label>
                    <input type="text" id="formZjsfno" required>
                </div>
                
                <div class="form-group">
                    <label for="formZjphone">电话 *</label>
                    <input type="text" id="formZjphone" required>
                </div>
                
                <div class="form-group">
                    <label for="formZjemail">邮箱 *</label>
                    <input type="email" id="formZjemail" required>
                </div>
                
                <div class="form-group">
                    <label for="formZjdw">单位 *</label>
                    <input type="text" id="formZjdw" required>
                </div>
                
                <div class="form-group">
                    <label for="formZjbz">备注 *</label>
                    <input type="text" id="formZjbz" required>
                </div>
                
                <div class="form-group">
                    <label for="formZjsc">归属 *</label>
                    <select id="formZjsc" required>
                        <option value="内部专家">内部专家</option>
                        <option value="外部专家">外部专家</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-danger" id="cancelBtn">关闭</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="zjk.js"></script>
    <script src="db.js"></script>
    <script src="expert-page.js"></script>
</body>
</html>
