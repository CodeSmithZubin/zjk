    <title>离线注册机_许可激活页</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>离线注册机 - 许可激活</h1>

        <div class="license-panel">
            <h2>待激活信息区</h2>
            <div class="panel-row">
                <span class="panel-label">机器码:</span>
                <span id="machine-code">加载中...</span>
                <button id="refresh-machine-code" class="btn secondary-btn">刷新</button>
            </div>
        </div>

        <div class="license-panel">
            <h2>系统激活区</h2>

            <div class="form-group">
                <label for="license-file">上传许可证文件 (.lic)</label>
                <input type="file" id="license-file" accept=".lic" class="form-control">
            </div>

            <div class="form-group">
                <label for="license-content">或粘贴许可证内容</label>
                <textarea id="license-content" rows="10" placeholder="请粘贴许可证文件内容..."></textarea>
            </div>

            <div class="button-group">
                <button id="activate-btn" class="btn primary-btn">激活许可证</button>
                <button id="clear-btn" class="btn secondary-btn">清空内容</button>
                <button id="back-btn" class="btn secondary-btn">返回注册信息页</button>
            </div>

            <div id="activation-result" style="margin-top: 20px; display: none;">
                <h3>激活结果</h3>
                <div id="result-message"></div>
                <div id="license-info" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

     
    <!--底部版权归属说明 ，布局紧贴底部-->
    <div style="position: fixed; bottom: 0; left: 0; right: 0; 
            padding: 15px 0;  ">

        <!-- 版权文字 -->
    <p style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;">
       软件著作版权归属：<a href="http://www.yinaje.com" target="_blank" style="color:#666">尹燕杰_yinaje</a>
    </p>
    </div>

    <script src="../js/crypto-utils.js"></script>
    <script src="../js/license-utils.js"></script>
    <script src="license-activation.js"></script>
</body>
</html>
