    <title>注册授权信息_查看页</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/crypto-utils.js"></script>
    <script src="../js/license-utils.js"></script>
    <script src="registration-view.js"></script>
</head>
<body>
    <div class="container">
        <h1>注册授权信息</h1>

        <div class="license-panel">
            <h2>系统注册授权面板</h2>
            <hr>
            <h5>请将机器码信息，复制给系统管理员获取授权许可证文件，用来激活系统的授权。</h5>
            <hr>
            <div class="panel-row">
                <span class="panel-label">机器码:</span>
                <span id="machine-code" class="machine-code">加载中...</span>
                <button id="copy-machine-code" class="btn secondary-btn">复制</button>
            </div>

            <div class="panel-row">
                <span class="panel-label">应用版本:</span>
                <span id="app-version">离线专家库_注册许可管理平台V3</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">授权状态:</span>
                <span id="auth-status">未授权</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">授权类型:</span>
                <span id="auth-type">-</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">授权用户:</span>
                <span id="auth-user">-</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">授权到期日:</span>
                <span id="expire-date">-</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">剩余天数:</span>
                <span id="days-remaining">-</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">授权模块:</span>
                <span id="auth-modules">-</span>
            </div>

            <div class="panel-row">
                <span class="panel-label">注册更新时间:</span>
                <span id="last-update">-</span>
            </div>
        </div>

        <div class="button-group">
            <button id="reset-registration" class="btn secondary-btn">重置注册信息</button>
            <button id="update-info" class="btn primary-btn">更新信息</button>
            <button id="back-to-a" class="btn secondary-btn">返回登录页面</button>
            <button id="activate-license" class="btn primary-btn">激活许可证</button>
        </div>
    </div>

 
    <!--底部版权归属说明 ，布局紧贴底部-->
    <div style="position: fixed; bottom: 0; left: 0; right: 0; 
            padding: 15px 0;  ">
    <!-- 淡色横线 -->
    <hr style="border: none; height: 1px; background-color: #e0e0e0; margin: 0 auto; width: 90%;" />
        <!-- 版权文字 -->
    <p style="text-align: center; margin-top: 15px; color: #666; font-size: 14px;">
       软件著作版权归属：<a href="http://www.yinaje.com" target="_blank" style="color:#666">尹燕杰_yinaje</a>
    </p>
    </div>
